  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between pt-safe pb-safe"><main class="flex-1 flex flex-col w-full max-w-[480px] mx-auto px-margin-mobile bg-surface"><div class="flex flex-col w-full pb-safe">
<!-- Progress Header & Top Bar -->
<header class="flex flex-col w-full py-space-sm mb-space-lg">
  <div class="flex items-center justify-between w-full mb-3">
    <button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface active:bg-surface-container transition-colors" type="button">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </button>
    <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-lowest">
      <div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
        <span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
      </div>
      <span class="font-headline-sm text-[17px] text-primary-container tracking-tight font-bold">PhoneMail</span>
    </div>
    <div class="w-10 flex items-center justify-end">
      <span class="font-label-md text-sm text-outline font-medium">2 of 3</span>
    </div>
  </div>
  <div aria-label="Step 2 of 3" class="flex items-center justify-center gap-1.5 w-full">
    <div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
    <div class="w-6 h-1.5 rounded-full bg-[#25D366]"></div>
    <div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
  </div>
</header>
<!-- 1. PhoneMail Brand Identity Badge -->

<!-- 2. Main Heading -->
<div class="text-center px-space-sm mb-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Verifying your number</h1>
</div>
<!-- 3. Sub-text with target phone and inline Edit action -->
<div class="flex items-center justify-center gap-1.5 text-center mb-space-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
      OTP sent to <span class="font-label-md text-label-md text-on-surface font-semibold">+91 98765 43210</span>
</p>
<button class="font-label-md text-label-md text-primary-container underline underline-offset-2 active:opacity-75" type="button">
      Edit
    </button>
</div>
<!-- Security End-to-End Badge Banner -->
<div class="flex items-center justify-center gap-1.5 py-1.5 px-space-md rounded-full bg-surface-container-low mx-auto mb-space-xl text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">End-to-End Secure Channel</span>
</div>
<!-- 4. OTP Inputs Grid (6 square digit cards) -->
<div class="w-full flex items-center justify-between gap-2 px-1 mb-space-xl" id="otp-container">
<!-- Box 1 -->
<div class="flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none">
<span class="font-headline-md text-headline-md text-on-surface font-bold">9</span>
</div>
<!-- Box 2 -->
<div class="flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none">
<span class="font-headline-md text-headline-md text-on-surface font-bold">8</span>
</div>
<!-- Box 3 -->
<div class="flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none">
<span class="font-headline-md text-headline-md text-on-surface font-bold">7</span>
</div>
<!-- Box 4 -->
<div class="flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none">
<span class="font-headline-md text-headline-md text-on-surface font-bold">6</span>
</div>
<!-- Box 5 -->
<div class="flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none">
<span class="font-headline-md text-headline-md text-on-surface font-bold">5</span>
</div>
<!-- Box 6: Active empty state -->
<div class="flex-1 h-14 bg-secondary-fixed rounded-xl flex items-center justify-center relative select-none">
<div class="w-0.5 h-6 bg-primary"></div>
</div>
</div>
<!-- Fallback/Alternative Channel Pill Row -->
<div class="flex items-center justify-center gap-space-sm mb-space-xl">
<button class="flex items-center gap-1.5 px-space-md h-10 rounded-full bg-surface-container text-on-surface-variant active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[18px] text-primary">sms</span>
<span class="font-label-md text-label-md">Check Messages</span>
</button>
<button class="flex items-center gap-1.5 px-space-md h-10 rounded-full bg-surface-container text-on-surface-variant active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[18px] text-primary">call</span>
<span class="font-label-md text-label-md">Call me</span>
</button>
</div>
<!-- 5. Primary CTA Action Button -->
<div class="w-full mb-space-lg">
<button class="w-full h-14 rounded-full bg-secondary-fixed flex items-center justify-center gap-2 active:bg-secondary-fixed-dim transition-colors" id="verify-button" type="button">
<span class="font-label-lg text-label-lg text-on-secondary-fixed font-bold">Verify</span>
<span class="material-symbols-outlined text-headline-sm text-on-secondary-fixed">arrow_forward</span>
</button>
</div>
<!-- 6. Secondary Status and Expiry Indicators -->
<div class="flex flex-col items-center justify-center gap-1 text-center py-space-xs">
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">update</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Resend OTP in <span class="font-label-sm text-label-sm font-semibold text-on-surface" id="resend-timer">00:25</span>
</p>
</div>
<div class="flex items-center gap-1.5 text-outline">
<span class="material-symbols-outlined text-[16px] text-outline">hourglass_bottom</span>
<p class="font-body-sm text-body-sm text-outline">
        Code expires in <span class="font-label-sm text-label-sm font-semibold text-on-surface-variant" id="expiry-timer">04:12</span>
</p>
</div>
</div>
<!-- Instant Dial Helper Pad (Optional Mobile Utilitarian Touch) -->

</div>
<script>
  (function() {
    const autofillBtn = document.getElementById('autofill-btn');
    const verifyBtn = document.getElementById('verify-button');
    const otpContainer = document.getElementById('otp-container');
    
    if (autofillBtn && otpContainer) {
      autofillBtn.addEventListener('click', function() {
        const lastBox = otpContainer.children[5];
        if (lastBox) {
          lastBox.className = "flex-1 h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center select-none shadow-none";
          lastBox.innerHTML = '<span class="font-headline-md text-headline-md text-on-surface font-bold">4</span>';
        }
        if (verifyBtn) {
          verifyBtn.classList.remove('bg-secondary-fixed');
          verifyBtn.classList.add('bg-secondary-container');
        }
        autofillBtn.disabled = true;
        autofillBtn.textContent = 'Applied';
        autofillBtn.classList.add('opacity-50');
      });
    }
  })();
</script></main>
