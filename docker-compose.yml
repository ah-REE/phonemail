# PhoneMail — Day 2 stack (OTP transport: sms-gate.app).
#
# Evaluator flow:  git clone <repo>  &&  docker compose up -d
# No .env file and no manual setup are required: every variable both sides need
# is set below, and any value that is still a PLACEHOLDER degrades gracefully
# (see the SMS_GATE_* block: without real credentials the API uses a fixed dev OTP).
# Real credentials belong in docker-compose.override.yml, which is gitignored —
# see docker-compose.override.yml.example.
#
# Startup order is enforced by healthchecks:
#   postgres healthy + redis healthy  ->  app starts (entrypoint runs migrations)
#   app healthy                       ->  smtp starts
#
# postgres and redis are intentionally NOT published to the host, and neither is
# smtp: they are internal-only services on the Compose network.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phonemail
      POSTGRES_PASSWORD: "phonemail"
      POSTGRES_DB: phonemail
      # keeps `pg_isready`/connections stable on a cold volume
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonemail -d phonemail"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"

      # ---------------------------------------------------------------
      # PLACEHOLDER SMS TRANSPORT — fill both (in an override file) to enable
      # real SMS. While either is still the value below, the API uses the fixed
      # dev OTP 123456 and reports devHint, so the whole flow still works for an
      # evaluator who never edits anything.
      # Real sends go through a self-hosted Android SMS gateway (sms-gate.app):
      # the gateway phone must be online with the app logged in.
      # ---------------------------------------------------------------
      SMS_GATE_LOGIN: "replace-with-real-sms-gate-login"
      SMS_GATE_PASSWORD: "replace-with-real-sms-gate-password"

      # Internal Compose DNS names; no host ports are published.
      REDIS_URL: "redis://redis:6379"

      # Internal Compose DNS name; matches the postgres service above.
      DATABASE_URL: "postgresql://phonemail:phonemail@postgres:5432/phonemail?schema=public"

      # ---------------------------------------------------------------
      # PLACEHOLDER — replace before any real deployment.
      # ---------------------------------------------------------------
      JWT_SECRET: "change-me-placeholder-jwt-secret"

      # --- mail path (app -> smtp -> app) ---
      SMTP_HOST: "smtp"
      SMTP_PORT: "25"
      MAIL_DOMAIN: "phonemail.com"
      # Must equal the smtp service's value; rotate both together.
      MAIL_WEBHOOK_SECRET: "replace-with-real-mail-webhook-secret"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  smtp:
    build:
      context: ./smtp
      dockerfile: Dockerfile
    depends_on:
      # The webhook target must be up before we accept mail for it.
      app:
        condition: service_healthy
    environment:
      SMTP_PORT: "25"
      MAIL_DOMAIN: "phonemail.com"
      APP_INBOUND_URL: "http://app:3000/api/mail/inbound"
      # Same committed value as the app's; see the note there.
      MAIL_WEBHOOK_SECRET: "replace-with-real-mail-webhook-secret"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.connect(25,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
